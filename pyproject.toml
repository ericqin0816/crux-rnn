[build-system]
requires = ["setuptools>=61,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "crux-rnn"
version = "2.0.0rc1"
description = "CruxRNN: Sequence Similarity, Practice Scheduling, and Interference in a Minimal Recurrent Neural Network"
requires-python = ">=3.8"
dependencies = ["torch>=1.13,<3", "numpy>=1.24,<3", "pandas>=1.5,<3", "scipy>=1.10,<2", "matplotlib>=3.7,<4"]

[project.scripts]
cruxrnn = "cruxrnn.cli:main"

[project.optional-dependencies]
dev = ["ruff==0.9.10"]

[tool.ruff]
target-version = "py38"
line-length = 100
include = ["src/cruxrnn/**/*.py", "tests/test_v2*.py", "scripts/v2_*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/test_v2*.py" = ["E402"]

[tool.ruff.format]
line-ending = "lf"

[tool.setuptools.packages.find]
where = ["src"]
